name: Publish Android APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.0)"
        required: true
        default: "v1.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          APK="releases/BachelorHisab-${TAG}.apk"
          if [ ! -f "$APK" ]; then
            echo "APK not found at $APK"
            exit 1
          fi
          python3 -c 'import json, os; tag=os.environ["TAG"]; notes=json.load(open("app-update.json")).get("notes", ""); open("release-notes.md", "w", encoding="utf-8").write(f"Bilingual (বাংলা + English) offline expense, mess meal, lend/borrow, and monthly budget tracker for students.\n\n### What is new in {tag}\n{notes}\n\nOfficial website: https://rcsbxyz-hub.github.io/BachelorHisab/\n")'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "BachelorHisab ${TAG}" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" "$APK" --title "BachelorHisab ${TAG}" --notes-file release-notes.md --latest
          fi